name: Feature request
description: Suggest an improvement or new capability for Nextern
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement to Nextern.

  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: Describe the problem this feature would solve.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature and how it should work.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Authentication
        - Learner dashboard
        - Program discovery
        - Program applications
        - Learning hub and assignments
        - Learner profile
        - Administrator dashboard
        - Program management
        - User management
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative approaches or workarounds.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mock-ups, screenshots, examples, or related information.